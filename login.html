<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NutriCalc BTH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Gaya CSS sama dengan register.html */
        :root { --primary-green: #27ae60; --dark-slate: #1e293b; --soft-bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--soft-bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: var(--dark-slate); margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 2px solid #f1f5f9; border-radius: 10px; box-sizing: border-box; }
        .btn-auth { width: 100%; padding: 14px; background: var(--primary-green); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-auth:hover { opacity: 0.9; transform: translateY(-2px); }
        .switch-text { text-align: center; margin-top: 15px; font-size: 0.85rem; }
        .switch-text a { color: var(--primary-green); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Login NutriCalc BTH</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUsername" required placeholder="Username Anda">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" required placeholder="Password Anda">
            </div>
            <button type="submit" class="btn-auth">Masuk</button>
        </form>
        <p class="switch-text">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const user = document.getElementById('loginUsername').value;
    const pass = document.getElementById('loginPassword').value;

    // Ambil data dari localStorage
    const storedPass = localStorage.getItem(user);

    // 1. Cek apakah username ada di database (localStorage)
    if (!storedPass) {
        alert('Username tidak terdaftar!');
        return;
    }

    // 2. Cek apakah password cocok
    if (storedPass === pass) {
        sessionStorage.setItem('isLoggedIn', 'true');
        sessionStorage.setItem('activeUser', user);
        
        alert('Login Berhasil!');
        window.location.href = 'dashboard.html';
    } else {
        // 3. Jika password salah
        alert('Username atau password salah!');
    }
});
    </script>
</body>
</html>
